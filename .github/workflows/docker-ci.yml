name: Docker Build & Validation

on:
  push:
    branches: [ development, staging, main ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ development, staging, main ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-ci.yml'

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          DEBUG=True
          SECRET_KEY=test-secret-key-for-docker-build
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          RDS_DB_NAME=hotel_management_system
          RDS_USERNAME=postgres
          RDS_PASSWORD=postgres123
          RDS_HOST=db
          RDS_PORT=5432
          REDIS_URL=redis://redis:6379/0
          JWT_ACCESS_TOKEN_LIFETIME=15
          JWT_REFRESH_TOKEN_LIFETIME=7
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Build Backend Docker Image
        run: |
          if [ -f "Dockerfile.backend" ]; then
            docker build -f Dockerfile.backend -t hotel-backend:test .
          elif [ -f "backend/Dockerfile" ]; then
            docker build -f backend/Dockerfile -t hotel-backend:test ./backend
          else
            echo "No backend Dockerfile found"
            exit 1
          fi

      - name: Build Frontend Docker Image (if exists)
        run: |
          if [ -f "Dockerfile.frontend" ]; then
            docker build -f Dockerfile.frontend -t hotel-frontend:test .
          elif [ -f "frontend/Dockerfile" ]; then
            docker build -f frontend/Dockerfile -t hotel-frontend:test ./frontend
          else
            echo "No frontend Dockerfile found, skipping"
          fi
        continue-on-error: true

      - name: Verify Docker images
        run: |
          docker images | grep hotel

      - name: Test Backend container starts
        run: |
          docker run --rm -d --name test-backend \
            -e DEBUG=True \
            -e SECRET_KEY=test-key \
            -e ALLOWED_HOSTS=* \
            hotel-backend:test

          sleep 10

          # Check if container is still running
          if docker ps | grep test-backend; then
            echo "Backend container started successfully"
            docker logs test-backend
            docker stop test-backend
          else
            echo "Backend container failed to start"
            docker logs test-backend || true
            exit 1
          fi

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DEBUG=True
          SECRET_KEY=test-secret-key-for-docker-compose
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          RDS_DB_NAME=hotel_management_system
          RDS_USERNAME=postgres
          RDS_PASSWORD=postgres123
          RDS_HOST=db
          RDS_PORT=5432
          REDIS_URL=redis://redis:6379/0
          JWT_ACCESS_TOKEN_LIFETIME=15
          JWT_REFRESH_TOKEN_LIFETIME=7
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build services with docker-compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 30

          echo "Checking service status..."
          docker compose ps

      - name: Check backend health
        run: |
          # Wait for backend to be ready
          for i in {1..30}; do
            if docker compose exec -T backend python manage.py check 2>/dev/null; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Check database connection
        run: |
          docker compose exec -T backend python manage.py migrate --check || true

      - name: Show service logs
        if: always()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo "=== Database Logs ==="
          docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v

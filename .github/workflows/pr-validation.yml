name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ development, staging, main ]

jobs:
  pr-checks:
    name: PR Title & Description Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: $PR_TITLE"

          # Check if PR title follows conventional commit format
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?: .+'; then
            echo "✓ PR title follows conventional commit format"
          else
            echo "✗ PR title should follow format: type(scope): description"
            echo "  Valid types: feat, fix, docs, style, refactor, test, chore, perf"
            echo "  Example: feat(auth): Add user registration endpoint"
            exit 1
          fi

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "⚠ PR has no description. Please add context about your changes."
            exit 1
          else
            echo "✓ PR has a description"
          fi

      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Branch name: $BRANCH_NAME"

          # Check if branch follows naming convention
          if echo "$BRANCH_NAME" | grep -qE '^(feature|bugfix|hotfix|release)/'; then
            echo "✓ Branch name follows convention"
          else
            echo "⚠ Branch name should follow pattern: type/description"
            echo "  Valid types: feature, bugfix, hotfix, release"
            echo "  Example: feature/US-01-user-registration"
          fi

  validate-changes:
    name: Validate Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "⚠ Merge conflicts detected. Please resolve them."
            git diff --name-only --diff-filter=U
            exit 1
          else
            echo "✓ No merge conflicts detected"
          fi

      - name: Check for large files
        run: |
          echo "Checking for large files (>5MB)..."
          LARGE_FILES=$(find . -type f -size +5M -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/dist/*" -not -path "*/build/*" || true)

          if [ -n "$LARGE_FILES" ]; then
            echo "⚠ Large files detected:"
            echo "$LARGE_FILES"
            echo "Please consider using Git LFS or removing these files."
            exit 1
          else
            echo "✓ No large files detected"
          fi

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."

          # Common patterns for secrets
          PATTERNS=(
            'password\s*=\s*["\047][^"\047]+["\047]'
            'api[_-]?key\s*=\s*["\047][^"\047]+["\047]'
            'secret[_-]?key\s*=\s*["\047][^"\047]+["\047]'
            'aws[_-]?access[_-]?key'
            'private[_-]?key'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git diff --cached --diff-filter=ACM | grep -iE "$pattern"; then
              echo "⚠ Potential secret found matching pattern: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "⚠ Potential secrets detected in changes. Please review."
            echo "If these are test credentials, consider using environment variables."
            exit 1
          else
            echo "✓ No obvious secrets detected"
          fi

      - name: Check for .env files
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '\.env$|\.env\..*'; then
            echo "⚠ .env file detected in changes. These should not be committed!"
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.env$|\.env\..*'
            exit 1
          else
            echo "✓ No .env files in changes"
          fi

  assign-reviewers:
    name: Auto-assign Reviewers
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'

    steps:
      - name: Auto-assign team members
        uses: actions/github-script@v7
        with:
          script: |
            // Auto-assign based on changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const changedFiles = files.map(f => f.filename);
            const reviewers = new Set();

            // Add reviewers based on file paths
            if (changedFiles.some(f => f.startsWith('backend/authentication/'))) {
              // Add backend/auth reviewers
              console.log('Authentication files changed');
            }
            if (changedFiles.some(f => f.startsWith('frontend/'))) {
              // Add frontend reviewers
              console.log('Frontend files changed');
            }

            console.log('Changed files:', changedFiles);

  size-label:
    name: Label PR Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR size and add label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const changes = additions + deletions;

            let sizeLabel;
            if (changes < 10) sizeLabel = 'size/XS';
            else if (changes < 50) sizeLabel = 'size/S';
            else if (changes < 200) sizeLabel = 'size/M';
            else if (changes < 500) sizeLabel = 'size/L';
            else sizeLabel = 'size/XL';

            console.log(`Total changes: ${changes} (+${additions} -${deletions})`);
            console.log(`Size label: ${sizeLabel}`);

            // Remove old size labels
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            for (const label of labels) {
              if (label.name.startsWith('size/')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                });
              }
            }

            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel]
            });

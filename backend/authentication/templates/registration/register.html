<h2>Register</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="{% url 'login' %}">Login</a></p>

{% for message in messages %}
  <p style="color:red;">{{ message }}</p>
{% endfor %}
